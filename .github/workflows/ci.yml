name: CI

on:
  push:
    branches: [release-*, main]
  pull_request:
    branches: [release-*, main]

permissions:
  contents: read

jobs:
  ci:
    name: lint + typecheck + build + test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Version sync
        run: npm run version:check
      - name: Build
        run: npm run build
      - name: Test (unit + integration + e2e against compiled CLI)
        run: npm run test
